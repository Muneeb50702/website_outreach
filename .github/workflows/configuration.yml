name: Verify Cloudflare configuration
on:
  push:
    branches: [main]
    paths: ['.github/workflows/configuration.yml', 'scripts/check-config.mjs', 'scripts/lib/cloudflare.mjs', 'scripts/lib/core.mjs']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-demo-lifecycle
  cancel-in-progress: false
jobs:
  configuration:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
      ROOT_DOMAIN: ${{ vars.ROOT_DOMAIN }}
      R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
      CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
      DEMO_TTL_DAYS: ${{ vars.DEMO_TTL_DAYS }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify zone, bucket and object permissions
        run: npm run check-config
